<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oncology MDO Command Center — Demo v1</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.mono { font-family: Consolas, "Courier New", Courier, monospace; }
.app { max-width: 1300px; margin: 0 auto; padding: 0 24px 64px; }

header.top {
  position: sticky; top: 0; z-index: 40;
  background: var(--cp-panel-strong); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--cp-border);
  margin: 0 -24px 24px; padding: 12px 24px;
}
.top-row { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; }
.brand .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--cp-accent); color: var(--cp-accent-fg);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.brand small { display: block; font-weight: 400; font-size: 11px; color: var(--cp-text-muted); }
.spacer { flex: 1; }
.persona { display: flex; align-items: center; gap: 8px; border: 1px solid var(--cp-border);
  border-radius: 999px; padding: 4px 12px 4px 4px; background: var(--cp-surface); }
.persona .av { width: 26px; height: 26px; border-radius: 50%; background: var(--cp-accent-soft);
  color: var(--cp-accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.persona b { font-size: 12.5px; font-weight: 600; }
.persona span { display: block; font-size: 10.5px; color: var(--cp-text-muted); line-height: 1.2; }

button { font-family: inherit; font-size: 13px; cursor: pointer; }
.btn { border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text);
  border-radius: 0.625rem; padding: 7px 14px; font-weight: 500;
  transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { background: var(--cp-surface-soft); border-color: var(--cp-border-strong); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
.btn.primary:hover { background: var(--cp-accent-hover); border-color: var(--cp-accent-hover); }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.card { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14); }
.card-h { padding: 14px 18px; border-bottom: 1px solid var(--cp-border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 13.5px; font-weight: 600; }
.card-h .sub, .sub { font-size: 11.5px; color: var(--cp-text-muted); font-weight: 400; }
.card-b { padding: 18px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14); }
.kpi .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); font-weight: 600; }
.kpi .val { font-size: 26px; font-weight: 650; margin-top: 4px; letter-spacing: -.02em; }
.kpi .val.sm { font-size: 19px; }
.kpi .note { font-size: 11.5px; color: var(--cp-text-soft); margin-top: 2px; }
.kpi .val.ok { color: var(--cp-success); }
.kpi .val.warn { color: var(--cp-warning); }

.wl { width: 100%; border-collapse: collapse; }
.wl th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--cp-text-muted); font-weight: 600; padding: 0 14px 10px; border-bottom: 1px solid var(--cp-border); }
.wl td { padding: 14px; border-bottom: 1px solid var(--cp-border); vertical-align: middle; }
.wl tr.row { cursor: pointer; transition: background .15s; }
.wl tr.row:hover { background: var(--cp-accent-soft); }
.wl tr:last-child td { border-bottom: none; }
.pt-name { font-weight: 600; font-size: 14px; }
.pt-meta { font-size: 11.5px; color: var(--cp-text-muted); }
.flag { font-size: 15px; margin-right: 6px; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px;
  font-size: 11.5px; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.pill .bullet { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ready { color: var(--cp-success); background: color-mix(in srgb, var(--cp-success) 12%, transparent); border-color: color-mix(in srgb, var(--cp-success) 30%, transparent); }
.pill.attn  { color: var(--cp-danger);  background: color-mix(in srgb, var(--cp-danger) 12%, transparent);  border-color: color-mix(in srgb, var(--cp-danger) 30%, transparent); }
.pill.wait  { color: var(--cp-text-muted); background: var(--cp-surface-soft); border-color: var(--cp-border); }
.pill.warnp { color: var(--cp-warning); background: color-mix(in srgb, var(--cp-warning) 14%, transparent); border-color: color-mix(in srgb, var(--cp-warning) 32%, transparent); }

.rd { display: flex; align-items: center; gap: 10px; }
.rd .track { width: 84px; height: 6px; border-radius: 999px; background: var(--cp-surface-soft); overflow: hidden; border: 1px solid var(--cp-border); }
.rd .fill { height: 100%; border-radius: 999px; transition: width .7s cubic-bezier(.3,.8,.3,1), background .5s; }
.rd .num { font-size: 12.5px; font-weight: 650; min-width: 34px; }
.blocker { font-size: 11.5px; color: var(--cp-text-muted); }

@keyframes flashrow { 0% { background: color-mix(in srgb, var(--cp-success) 30%, transparent); } 100% { background: transparent; } }
.flash { animation: flashrow 2.2s ease-out; }

.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--cp-text-muted); padding: 0; margin-bottom: 14px; font-size: 13px; }
.back:hover { color: var(--cp-accent); }
.det-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
.det-head h1 { margin: 0; font-size: 23px; font-weight: 650; letter-spacing: -.02em; }
.det-head .dx { font-size: 13px; color: var(--cp-text-muted); margin-top: 3px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--cp-border); margin-bottom: 20px; flex-wrap: wrap; }
.tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 9px 14px;
  color: var(--cp-text-muted); font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
.tab:hover { color: var(--cp-text); }
.tab.on { color: var(--cp-accent); border-bottom-color: var(--cp-accent); font-weight: 600; }
.tab .badge { font-size: 10px; font-weight: 700; border-radius: 999px; padding: 1px 6px; background: var(--cp-danger); color: #fff; line-height: 1.5; }
.tab .badge.g { background: var(--cp-success); }

.grid2 { display: grid; grid-template-columns: 1fr 320px; gap: 18px; align-items: start; }

.sec { border-bottom: 1px solid var(--cp-border); }
.sec:last-child { border-bottom: none; }
.sec-h { padding: 11px 18px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
  color: var(--cp-text-muted); font-weight: 700; background: var(--cp-surface-soft); }
.rows { padding: 6px 0; }
.r { display: grid; grid-template-columns: 176px 1fr; gap: 14px; padding: 7px 18px; align-items: baseline; }
.r .k { font-size: 12.5px; color: var(--cp-text-muted); }
.r .v { font-size: 13.5px; }
.r.miss .v { color: var(--cp-danger); font-weight: 600; }
.r.stale .v { color: var(--cp-warning); font-weight: 600; }
.r.pend .v { color: var(--cp-text-muted); }
.r.fresh .v { color: var(--cp-success); font-weight: 600; }

.src { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; font-size: 10.5px;
  color: var(--cp-text-muted); border: 1px solid var(--cp-border); border-radius: 6px; padding: 0 5px;
  background: var(--cp-surface-soft); cursor: pointer; vertical-align: middle;
  font-family: Consolas, "Courier New", Courier, monospace; }
.src:hover { border-color: var(--cp-accent); color: var(--cp-accent); }

.ck { display: flex; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--cp-border); align-items: flex-start; }
.ck:last-child { border-bottom: none; }
.ck .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
.ck .ic.ok { background: color-mix(in srgb, var(--cp-success) 16%, transparent); color: var(--cp-success); }
.ck .ic.no { background: color-mix(in srgb, var(--cp-danger) 16%, transparent); color: var(--cp-danger); }
.ck .body { flex: 1; }
.ck .t { font-size: 13.5px; font-weight: 550; }
.ck .d { font-size: 12px; color: var(--cp-text-muted); margin-top: 1px; }
.tag { display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  border-radius: 5px; padding: 1px 5px; margin-left: 7px; vertical-align: middle; }
.tag.dec { background: color-mix(in srgb, var(--cp-danger) 16%, transparent); color: var(--cp-danger); }
.tag.der { background: color-mix(in srgb, var(--cp-link) 16%, transparent); color: var(--cp-link); }

.guard { border: 1px dashed var(--cp-border-strong); border-radius: 12px; padding: 12px 14px;
  font-size: 12.5px; color: var(--cp-text-muted); margin-top: 16px; }
.guard b { color: var(--cp-text); }
.qbox { border-left: 3px solid var(--cp-accent); padding: 2px 0 2px 14px; margin-bottom: 18px; }
.qbox h4 { margin: 0 0 4px; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.qbox p { margin: 0; font-size: 12.5px; color: var(--cp-text-muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two h5 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); }
.two ul { margin: 0; padding-left: 17px; }
.two li { font-size: 12.5px; margin-bottom: 6px; }
.two li b { font-weight: 600; }

.trial { padding: 14px 18px; border-bottom: 1px solid var(--cp-border); }
.trial:last-child { border-bottom: none; }
.trial .tt { font-weight: 600; font-size: 13.5px; }
.trial .tid { font-size: 11px; color: var(--cp-text-muted); }
.trial .td { font-size: 12.5px; color: var(--cp-text-muted); margin-top: 5px; }
.trial.lock { opacity: .65; }

.tl { position: relative; padding-left: 26px; }
.tl::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 2px; background: var(--cp-border); }
.ev { position: relative; padding-bottom: 18px; }
.ev::before { content: ""; position: absolute; left: -23px; top: 5px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--cp-surface); border: 2px solid var(--cp-border-strong); }
.ev.hi::before { background: var(--cp-accent); border-color: var(--cp-accent); }
.ev .d8 { font-size: 11px; color: var(--cp-text-muted); font-family: Consolas, "Courier New", Courier, monospace; }
.ev .tt { font-size: 13.5px; font-weight: 550; margin-top: 1px; }
.ev .dd { font-size: 12.5px; color: var(--cp-text-muted); }

textarea { width: 100%; min-height: 92px; resize: vertical; font-family: inherit; font-size: 13.5px; line-height: 1.55;
  background: var(--cp-bg-elevated); color: var(--cp-text); border: 1px solid var(--cp-border); border-radius: 0.625rem; padding: 10px 12px; }
textarea:focus { outline: none; border-color: var(--cp-accent); }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); font-weight: 600; margin-bottom: 6px; display: block; }
.letter { background: var(--cp-bg-elevated); border: 1px solid var(--cp-border); border-radius: 12px;
  padding: 18px 20px; font-size: 12.5px; line-height: 1.65; white-space: pre-wrap;
  font-family: Consolas, "Courier New", Courier, monospace; }
.chipsrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 999px; padding: 4px 11px; font-size: 12px; }
.chip:hover, .chip.on { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }

.side .card + .card { margin-top: 14px; }
.stat { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; font-size: 12.5px; border-bottom: 1px solid var(--cp-border); }
.stat:last-child { border-bottom: none; }
.stat .k { color: var(--cp-text-muted); flex-shrink: 0; }
.stat .v { font-weight: 600; text-align: right; word-break: break-word; }
.std { padding: 7px 0; border-bottom: 1px solid var(--cp-border); }
.std:last-child { border-bottom: none; }
.std .n { font-size: 12.5px; font-weight: 600; }
.std .v { font-size: 11.5px; color: var(--cp-text-muted); margin-top: 1px; }

#toast { position: fixed; right: 24px; bottom: 24px; z-index: 90; width: 360px; background: var(--cp-surface);
  border: 1px solid var(--cp-border); border-left: 3px solid var(--cp-success); border-radius: 12px;
  box-shadow: var(--cp-shadow); padding: 14px 16px; transform: translateY(160%); opacity: 0;
  transition: transform .45s cubic-bezier(.2,.9,.3,1), opacity .35s; }
#toast.show { transform: translateY(0); opacity: 1; }
#toast .th { font-size: 13px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
#toast .tb { font-size: 12.5px; color: var(--cp-text-muted); margin-top: 4px; }

#prov { position: fixed; z-index: 95; width: 340px; display: none; background: var(--cp-surface);
  border: 1px solid var(--cp-border-strong); border-radius: 12px; box-shadow: var(--cp-shadow); padding: 14px 16px; }
#prov h5 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--cp-text-muted); }
#prov .pr { display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 11.5px; padding: 3px 0; }
#prov .pr .k { color: var(--cp-text-muted); }
#prov .pr .v { font-family: Consolas, "Courier New", Courier, monospace; word-break: break-all; }

.footnote { margin-top: 22px; font-size: 11.5px; color: var(--cp-text-muted); text-align: center; }.banner { display: flex; align-items: center; gap: 10px; background: var(--cp-accent-soft);
  border: 1px solid color-mix(in srgb, var(--cp-accent) 28%, transparent); border-radius: 12px;
  padding: 10px 14px; font-size: 12.5px; margin-bottom: 20px; }
.hide { display: none !important; }

/* ---------- cohort ---------- */
.crit { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.crit .c { border: 1px solid var(--cp-border); background: var(--cp-surface); border-radius: 999px;
  padding: 5px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }
.crit .c .box { width: 13px; height: 13px; border-radius: 4px; border: 1px solid var(--cp-border-strong);
  display: grid; place-items: center; font-size: 9px; line-height: 1; }
.crit .c.on { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
.crit .c.on .box { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
.crit .c.na { opacity: .5; cursor: not-allowed; text-decoration: line-through; }
.crit .c .val { font-size: 11px; color: var(--cp-text-muted); font-weight: 600; }
.crit .c.on .val { color: var(--cp-accent); }

.nbig { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.nsub { font-size: 12.5px; color: var(--cp-text-muted); }
.bars { margin-top: 4px; }
.bar { display: grid; grid-template-columns: 200px 1fr 68px; gap: 12px; align-items: center; padding: 4px 0; }
.bar .bl { font-size: 12.5px; }
.bar .bt { height: 16px; border-radius: 5px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); overflow: hidden; }
.bar .bf { height: 100%; background: var(--cp-accent); opacity: .82; }
.bar .bf.g { background: var(--cp-success); }
.bar .bf.r { background: var(--cp-danger); }
.bar .bf.a { background: var(--cp-warning); }
.bar .bn { font-size: 12px; color: var(--cp-text-muted); text-align: right; font-variant-numeric: tabular-nums; }

.note-warn { border: 1px solid color-mix(in srgb, var(--cp-warning) 40%, transparent);
  background: color-mix(in srgb, var(--cp-warning) 9%, transparent); border-radius: 12px;
  padding: 11px 14px; font-size: 12.5px; margin-bottom: 16px; }
.note-bad { border: 1px solid color-mix(in srgb, var(--cp-danger) 40%, transparent);
  background: color-mix(in srgb, var(--cp-danger) 8%, transparent); border-radius: 12px;
  padding: 11px 14px; font-size: 12.5px; margin-bottom: 16px; }
.vtab { width: 100%; border-collapse: collapse; margin-top: 6px; }
.vtab th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--cp-text-muted); font-weight: 600; padding: 0 8px 8px 0; border-bottom: 1px solid var(--cp-border); }
.vtab td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--cp-border); font-size: 12.5px; }
.vtab td:last-child, .vtab th:last-child { text-align: right; padding-right: 0; }
.vtab tr:last-child td { border-bottom: none; }

/* ---------- patient summary ---------- */
.ps { max-width: 660px; }
.ps h4 { margin: 22px 0 6px; font-size: 15px; font-weight: 650; }
.ps h4:first-child { margin-top: 0; }
.ps p { margin: 0 0 10px; font-size: 14.5px; line-height: 1.65; }
.ps ul { margin: 0 0 10px; padding-left: 20px; }
.ps li { font-size: 14.5px; line-height: 1.65; margin-bottom: 5px; }
.ps .lede { font-size: 15.5px; line-height: 1.6; }

/* ---------- MDO mode ---------- */
#mdoMode { position: fixed; inset: 0; z-index: 80; background: var(--cp-bg); display: none;
  flex-direction: column; overflow: hidden; }
#mdoMode.on { display: flex; }
.mm-top { display: flex; align-items: center; gap: 16px; padding: 12px 26px;
  border-bottom: 1px solid var(--cp-border); background: var(--cp-bg-elevated); flex-wrap: wrap; }
.mm-top .ttl { font-weight: 650; font-size: 14px; }
.mm-prog { display: flex; gap: 6px; align-items: center; }
.mm-prog .d { width: 26px; height: 5px; border-radius: 999px; background: var(--cp-border); }
.mm-prog .d.on { background: var(--cp-accent); }
.mm-prog .d.done { background: var(--cp-success); }
.mm-body { flex: 1; overflow: auto; padding: 26px 26px 8px; }
.mm-inner { max-width: 1180px; margin: 0 auto; }
.mm-h { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.mm-h h2 { margin: 0; font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.mm-h .s { font-size: 14px; color: var(--cp-text-muted); margin-top: 4px; }
.mm-cols { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; align-items: start; }
.fact { display: grid; grid-template-columns: 150px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--cp-border); }
.fact:last-child { border-bottom: none; }
.fact .k { font-size: 12.5px; color: var(--cp-text-muted); }
.fact .v { font-size: 15px; }
.fact .v.bad { color: var(--cp-danger); font-weight: 600; }
.fact .v.warn { color: var(--cp-warning); font-weight: 600; }
.mm-block { border: 1px solid color-mix(in srgb, var(--cp-warning) 45%, transparent);
  background: color-mix(in srgb, var(--cp-warning) 10%, transparent); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 18px; }
.mm-block b { color: var(--cp-warning); }
.mm-dock { border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); padding: 12px 26px; }
.mm-dock-in { max-width: 1180px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.mm-dock textarea { min-height: 40px; flex: 1; min-width: 260px; font-size: 13px; }
.kbd { font-family: Consolas, "Courier New", Courier, monospace; font-size: 11px; border: 1px solid var(--cp-border);
  border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--cp-surface); color: var(--cp-text-muted); }

/* ---------- voice copilot ---------- */
#voicePanel { position: fixed; right: 20px; bottom: 20px; z-index: 100; width: min(430px, calc(100vw - 40px));
  max-height: calc(100vh - 40px); display: none; flex-direction: column; background: var(--cp-surface);
  border: 1px solid var(--cp-border-strong); border-radius: 16px; box-shadow: var(--cp-shadow); overflow: hidden; }
#voicePanel.on { display: flex; }
.vc-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--cp-border);
  background: var(--cp-bg-elevated); }
.vc-head .orb { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 700; }
.vc-head .title { font-size: 13.5px; font-weight: 650; }
.vc-head .status { font-size: 11px; color: var(--cp-text-muted); }
.vc-body { padding: 14px; overflow: auto; }
.vc-context { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--cp-border);
  border-radius: 10px; background: var(--cp-surface-soft); margin-bottom: 12px; font-size: 12px; }
.vc-context select { flex: 1; min-width: 0; border: 1px solid var(--cp-border); border-radius: 8px; padding: 5px 7px;
  background: var(--cp-surface); color: var(--cp-text); font: inherit; }
.vc-prompts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.vc-prompt { border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text);
  border-radius: 999px; padding: 5px 9px; font-size: 11px; }
.vc-prompt:hover { border-color: var(--cp-accent); color: var(--cp-accent); background: var(--cp-accent-soft); }
.vc-turn { padding: 10px 11px; border-radius: 10px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.5; }
.vc-turn.user { margin-left: 34px; background: var(--cp-accent-soft); border: 1px solid color-mix(in srgb, var(--cp-accent) 25%, transparent); }
.vc-turn.agent { margin-right: 18px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); }
.vc-turn .who { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--cp-text-muted); font-weight: 700; margin-bottom: 3px; }
.vc-empty { font-size: 12px; color: var(--cp-text-muted); text-align: center; padding: 8px 12px 16px; }
.vc-input { display: flex; gap: 7px; padding: 11px 14px; border-top: 1px solid var(--cp-border); background: var(--cp-bg-elevated); }
.vc-input input { flex: 1; min-width: 0; border: 1px solid var(--cp-border); border-radius: 10px; padding: 8px 10px;
  background: var(--cp-surface); color: var(--cp-text); font: inherit; }
.vc-input input:focus { outline: none; border-color: var(--cp-accent); }
.vc-mic.listening { background: var(--cp-danger); border-color: var(--cp-danger); color: var(--cp-accent-fg); }
.vc-metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.vc-metric { border: 1px solid var(--cp-border); border-radius: 9px; padding: 7px 8px; background: var(--cp-bg-elevated); }
.vc-metric .n { font-size: 15px; font-weight: 650; }
.vc-metric .l { font-size: 9.5px; color: var(--cp-text-muted); text-transform: uppercase; letter-spacing: .04em; }
.vc-note { margin-top: 9px; font-size: 10.5px; color: var(--cp-text-muted); }
@keyframes evidencefocus { 0%, 100% { outline-color: transparent; } 35% { outline-color: var(--cp-accent); } }
.voice-focus { outline: 3px solid transparent; outline-offset: 3px; animation: evidencefocus 1.8s ease 2; }

@media (max-width: 1020px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="dot">M</div>
      <div>Oncology MDO Command Center
        <small id="brandSub">Colorectal tumour board</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn sm" id="themeBtn">Toggle theme</button>
    <button class="btn sm" id="voiceBtn">🎙 Voice copilot</button>
    <button class="btn sm" id="mdoBtn">▶ MDO mode</button>
    <button class="btn sm primary" id="simBtn">▶ Simulate CT arrival (IT-003)</button>
    <div class="persona">
      <div class="av">NS</div>
      <div><b>Nurse specialist</b><span>Case manager · MDO coordinator</span></div>
    </div>
  </div>
</header>

<div class="app">
  <div class="banner">
    <span>🔒</span>
    <div id="banner"></div>
  </div>

  <section id="viewList">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="card-h">
        <h3>Worklist</h3>
        <span class="sub">ranked by evidence completeness — least ready first</span>
        <div class="spacer"></div>
        <span class="sub" id="wlMeta"></span>
      </div>
      <table class="wl">
        <thead><tr>
          <th style="width:24%">Case</th>
          <th style="width:23%">Diagnosis</th>
          <th style="width:16%">Packet status</th>
          <th style="width:16%">Evidence complete</th>
          <th>Blocking</th>
        </tr></thead>
        <tbody id="wlBody"></tbody>
      </table>
    </div>
    <p class="footnote" id="listFoot"></p>
  </section>

  <section id="viewDetail" class="hide"></section>
</div>

<div id="toast"><div class="th"><span>✅</span><span id="toastT"></span></div><div class="tb" id="toastB"></div></div>
<div id="prov"></div>
<div id="mdoMode"></div>
<aside id="voicePanel" aria-label="MDO voice copilot"></aside>

<script>
/*__MDO_DATA__*/
</script>

<script>
(() => {
"use strict";

const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

const BASE = {};
MDO.cases.forEach((c) => { BASE[c.short] = c; });
const RESOLVED_IT = MDO.resolvedIT;
const ORDER = MDO.cases.map((c) => c.short);

const state = { view: "list", caseId: null, tab: "packet", resolved: false, decisions: {},
  criteria: { mol: true, mCategory: true, side: false, ecog: false, ageBand: false, priorLines: false },
  mdoOn: false, mdoIndex: 0, mdoStart: 0, voiceOn: false, voiceCase: "IT-003",
  voiceTurns: [], voiceAttempts: 0, voiceRecognised: 0, voiceLatency: null, voiceSpeechLatency: null,
  voiceListening: false, voiceSpeak: true };

function caseOf(short) {
  return (short === "IT-003" && state.resolved) ? RESOLVED_IT : BASE[short];
}
function rdColor(n) { return n >= 100 ? "var(--cp-success)" : n >= 85 ? "var(--cp-warning)" : "var(--cp-danger)"; }
function statusPill(s) {
  return s === "ready-for-review"
    ? '<span class="pill ready"><span class="bullet"></span>Ready for review</span>'
    : '<span class="pill attn"><span class="bullet"></span>Attention needed</span>';
}
function ageOf(h) { return h.ageBand + " " + h.sex; }

/* Match a failing readiness rule to a declared packet.missingData entry. */
function declaredFor(name, missing) {
  const n = name.toLowerCase();
  return (missing || []).find((m) => {
    const f = (m.field || "").toLowerCase();
    if (n.indexOf("cea") >= 0 && f.indexOf("cea") >= 0) return true;
    if (n.indexOf("msi") >= 0 && (f.indexOf("msi") >= 0 || f.indexOf("mmr") >= 0)) return true;
    if (n.indexOf("imaging") >= 0 && (f.indexOf("ct") >= 0 || f.indexOf("imaging") >= 0 || f.indexOf("mri") >= 0 || f.indexOf("pet") >= 0)) return true;
    if (n.indexOf("ecog") >= 0 && f.indexOf("ecog") >= 0) return true;
    if (n.indexOf("kras") >= 0 && f.indexOf("kras") >= 0) return true;
    if (n.indexOf("nras") >= 0 && f.indexOf("nras") >= 0) return true;
    if (n.indexOf("braf") >= 0 && f.indexOf("braf") >= 0) return true;
    return false;
  });
}
function failing(c) { return c.readiness.checks.filter((k) => !k.ok); }

/* ============================== worklist ============================== */
function renderShell() {
  const m = MDO.meta;
  $("#brandSub").textContent =
    m.profileLabel + " · fixture reference date " + m.referenceDate + " · seed " + m.seed;
  $("#banner").innerHTML =
    "<b>Synthetic data.</b> Three MdoPacket fixtures (NL-001, DE-002, IT-003) from the 2026-08-27 dataset, " +
    "rendered directly against the canonical <span class='mono'>" + esc(m.schemaTitle) + "</span> schema. " +
    "No real patient information. Local fixtures — not connected to Fabric.";
  $("#listFoot").innerHTML =
    "Every field is rendered from the normalised MdoPacket and carries its FHIR R4 source citation. " +
    "Built " + esc(m.builtOn) + " from <span class='mono'>data/mdo_packets/</span>.";
}

function renderList() {
  const body = $("#wlBody");
  body.textContent = "";

  const rows = ORDER.slice().sort((a, b) => caseOf(a).readiness.score - caseOf(b).readiness.score);

  rows.forEach((short) => {
    const c = caseOf(short), p = c.packet, rs = c.readiness;
    const fails = failing(c);
    const tr = el("tr", "row");
    tr.dataset.id = short;

    const blHtml = fails.length
      ? fails.map((f) => {
          const d = declaredFor(f.name, p.missingData);
          return "<div>• " + esc(f.name) + (d ? " <span class='tag dec'>" + esc(d.status) + "</span>" : " <span class='tag der'>derived</span>") + "</div>";
        }).join("")
      : '<span style="color:var(--cp-success)">Nothing outstanding</span>';

    tr.innerHTML =
      '<td><div class="pt-name"><span class="flag">' + c.flag + "</span>" + esc(c.short) + "</div>" +
        '<div class="pt-meta">' + esc(ageOf(p.header)) + " · b." + p.header.yearOfBirth + " · " + esc(p.sourceHospital) + "</div>" +
        '<div class="pt-meta mono">' + esc(p.patientId) + "</div></td>" +
      '<td><div style="font-size:13px">' + esc(cap(p.diagnosis.primary.histology)) + ", " + esc(p.diagnosis.primary.site) + "</div>" +
        '<div class="pt-meta">' + esc(p.stage.tnm.combined) + " · stage " + esc(p.stage.stageGroup) +
        " · mets: " + esc(p.diagnosis.metastases.map((x) => x.site).join(", ") || "none") + "</div></td>" +
      "<td>" + statusPill(p.readinessState.status) + "</td>" +
      '<td><div class="rd"><div class="track"><div class="fill" style="width:' + rs.score + "%;background:" + rdColor(rs.score) + '"></div></div>' +
        '<span class="num" style="color:' + rdColor(rs.score) + '">' + rs.passed + "/" + rs.total + "</span></div></td>" +
      '<td class="blocker">' + blHtml + "</td>";

    tr.addEventListener("click", () => openCase(short));
    body.appendChild(tr);
  });

  const cases = ORDER.map(caseOf);
  const ready = cases.filter((c) => c.packet.readinessState.status === "ready-for-review").length;
  const declared = cases.reduce((n, c) => n + c.packet.missingData.length, 0);
  const derived = cases.reduce((n, c) => n + failing(c).filter((f) => !declaredFor(f.name, c.packet.missingData)).length, 0);
  const resources = cases.reduce((n, c) => n + c.packet.sourceCitations.resources.length, 0);

  $("#kpis").innerHTML =
    kpi("Cases on agenda", ORDER.length, "colorectal MDO") +
    kpi("Ready for review", ready + " / " + ORDER.length, ready === ORDER.length ? "all cases discussion-ready" : (ORDER.length - ready) + " need coordination", ready === ORDER.length ? "ok" : "") +
    kpi("Evidence gaps", declared + derived, declared + " declared in packet · " + derived + " derived", (declared + derived) ? "warn" : "ok") +
    kpi("Preparation", "15–20 min", "manual, per case — clinician estimate", "sm ok");

  $("#wlMeta").innerHTML = resources + " FHIR resources normalised across " + ORDER.length + " bundles";
}
function kpi(lab, val, note, cls) {
  return '<div class="kpi"><div class="lab">' + esc(lab) + '</div><div class="val ' + (cls || "") + '">' +
    esc(val) + '</div><div class="note">' + esc(note) + "</div></div>";
}

/* ============================== detail ============================== */
function openCase(short) {
  state.view = "detail"; state.caseId = short; state.tab = "packet";
  $("#viewList").classList.add("hide"); $("#viewDetail").classList.remove("hide");
  renderDetail(); window.scrollTo({ top: 0 });
}
function backToList() {
  state.view = "list"; state.caseId = null;
  $("#viewDetail").classList.add("hide"); $("#viewList").classList.remove("hide");
  renderList();
}

function renderDetail() {
  const short = state.caseId, c = caseOf(short), p = c.packet, rs = c.readiness;
  const fails = failing(c);
  const v = $("#viewDetail"); v.textContent = "";

  const back = el("button", "back", "← Back to worklist");
  back.addEventListener("click", backToList);
  v.appendChild(back);

  const head = el("div", "det-head");
  head.innerHTML =
    "<div><h1>" + c.flag + " " + esc(c.short) + "</h1>" +
    '<div class="dx">' + esc(ageOf(p.header)) + " · born " + p.header.yearOfBirth + " · " + esc(p.sourceHospital) + " (" + esc(c.country) + ")</div>" +
    '<div class="dx">' + esc(cap(p.diagnosis.primary.histology)) + ", " + esc(p.diagnosis.primary.site) +
    " · " + esc(p.stage.system) + " " + esc(p.stage.tnm.combined) + " · stage " + esc(p.stage.stageGroup) + "</div>" +
    '<div class="dx mono">' + esc(p.patientId) + "</div></div>" +
    '<div class="spacer"></div>' +
    "<div style='text-align:right'>" + statusPill(p.readinessState.status) +
    '<div class="rd" style="margin-top:8px;justify-content:flex-end"><div class="track"><div class="fill" style="width:' + rs.score + "%;background:" + rdColor(rs.score) + '"></div></div>' +
    '<span class="num" style="color:' + rdColor(rs.score) + '">' + rs.passed + "/" + rs.total + "</span></div>" +
    "<div class='sub' style='margin-top:4px'>" + esc(p.readinessState.reason) + "</div></div>";
  v.appendChild(head);

  const defs = [
    { k: "packet", l: "MDO packet" },
    { k: "ready", l: "Readiness", badge: fails.length ? String(fails.length) : "✓" },
    { k: "brief", l: "Board briefing" },
    { k: "cohort", l: "Similar cases" },
    { k: "trials", l: "Trials" },
    { k: "timeline", l: "Timeline" },
    { k: "patient", l: "Patient summary" },
    { k: "decision", l: "Decision & letter" }
  ];
  const tabs = el("div", "tabs");
  defs.forEach((t) => {
    const b = el("button", "tab" + (state.tab === t.k ? " on" : ""));
    b.innerHTML = esc(t.l) + (t.badge ? ' <span class="badge' + (t.badge === "✓" ? " g" : "") + '">' + t.badge + "</span>" : "");
    b.addEventListener("click", () => { state.tab = t.k; renderDetail(); });
    tabs.appendChild(b);
  });
  v.appendChild(tabs);

  const grid = el("div", "grid2");
  const main = el("div"); const side = el("div", "side");
  main.appendChild({ packet: tabPacket, ready: tabReady, brief: tabBrief, cohort: tabCohort,
    trials: tabTrials, timeline: tabTimeline, patient: tabPatient, decision: tabDecision }[state.tab](c));
  side.appendChild(sidePanel(c));
  grid.appendChild(main); grid.appendChild(side);
  v.appendChild(grid);
}

/* ---- packet ---- */
function row(k, v, cls, cite, p) {
  const r = el("div", "r" + (cls ? " " + cls : ""));
  r.appendChild(el("div", "k", esc(k)));
  const vd = el("div", "v", esc(v));
  if (cite) {
    const chip = el("span", "src", cite.resourceType);
    chip.addEventListener("click", (e) => showProv(e, k, cite, p));
    vd.appendChild(chip);
  }
  r.appendChild(vd);
  return r;
}
function section(title, rows) {
  const s = el("div", "sec");
  s.appendChild(el("div", "sec-h", esc(title)));
  const rr = el("div", "rows");
  rows.forEach((x) => rr.appendChild(x));
  s.appendChild(rr);
  return s;
}

function tabPacket(c) {
  const p = c.packet;
  const card = el("div", "card");
  card.appendChild(el("div", "card-h",
    "<h3>MDO packet</h3><span class='sub'>" + esc(p.adapterLabel) + " → normalised MdoPacket</span>" +
    "<div class='spacer'></div><span class='sub'>" + p.sourceCitations.resources.length + " source resources</span>"));

  // Diagnosis
  const dx = [
    row("Primary tumour", p.diagnosis.primary.display + " (" + p.diagnosis.primary.system + " " + p.diagnosis.primary.code + ")", null, p.diagnosis.primary.sourceCitation, p),
    row("Histology / site", cap(p.diagnosis.primary.histology) + " — " + p.diagnosis.primary.site, null, p.diagnosis.primary.sourceCitation, p),
    row("SNOMED CT", p.diagnosis.primary.snomedCode + " · " + p.diagnosis.primary.snomedDisplay, null, p.diagnosis.primary.sourceCitation, p),
    row("Date of diagnosis", p.diagnosis.primary.diagnosisDate, null, p.diagnosis.primary.sourceCitation, p)
  ];
  p.diagnosis.metastases.forEach((m, i) => {
    dx.push(row("Metastasis " + (i + 1), cap(m.site) + " (" + m.system + " " + m.code + ") — " + m.diagnosisDate, null, m.sourceCitation, p));
  });
  if (!p.diagnosis.metastases.length) dx.push(row("Metastases", "None recorded"));
  dx.push(row("Clinical stage", p.stage.system + " " + p.stage.tnm.combined + " · stage group " + p.stage.stageGroup, null, p.stage.sourceCitation, p));
  dx.push(row("TNM detail", "T " + p.stage.tnm.t + " · N " + p.stage.tnm.n + " · M " + p.stage.tnm.m + " (prefix " + p.stage.tnm.prefix + ")", null, p.stage.sourceCitation, p));
  card.appendChild(section("Diagnosis & staging", dx));

  // Performance status
  card.appendChild(section("Performance status", [
    p.ecog
      ? row("ECOG", "Grade " + p.ecog.score + " (" + p.ecog.date + ")", null, p.ecog.sourceCitation, p)
      : row("ECOG", "⚠ Not recorded — the packet carries ecog: null", "miss")
  ]));

  // Molecular
  const mol = ["kras", "nras", "braf", "msi"].map((key) => {
    const m = p.molecularProfile[key];
    const label = key === "msi" ? "MSI / MMR" : key.toUpperCase();
    if (!m) return row(label, "⚠ Absent from the packet", "miss");
    const bad = m.status === "not-tested" || m.status === "result-pending" || m.status === "unknown";
    const txt = (m.interpretation ? m.interpretation + " — " : "") + m.status + " (" + m.date + ")";
    return row(label, (bad ? "⚠ " : "") + txt, bad ? "miss" : null, m.sourceCitation, p);
  });
  if (p.molecularProfile.notes && p.molecularProfile.notes.length) {
    mol.push(row("Notes", p.molecularProfile.notes.join("; ")));
  }
  card.appendChild(section("Molecular profile", mol));

  // Labs
  const cea = p.labs.cea;
  card.appendChild(section("Laboratory", [
    row("CEA", cea.value + " " + cea.unit + " (" + cea.date + ")" + (cea.isCurrent ? "" : " — ⚠ not current"),
      cea.isCurrent ? null : "stale", cea.sourceCitation, p)
  ]));

  // Imaging
  const img = p.imaging.map((i) => {
    const pending = i.status === "result-pending";
    const fresh = !!i.arrivedDate;
    return row(i.type,
      (pending ? "⏳ " : "") + i.summary + " · " + i.date + " · status " + i.status +
      (i.arrivedDate ? " · arrived " + i.arrivedDate : "") + (i.isCurrent ? "" : pending ? "" : " — not current"),
      pending ? "pend" : fresh ? "fresh" : null, i.sourceCitation, p);
  });
  card.appendChild(section("Imaging", img.length ? img : [row("Imaging", "⚠ None in the packet", "miss")]));

  // Pathology
  card.appendChild(section("Pathology", [
    row("Report", cap(p.pathology.histology) + " — " + p.pathology.site, null, p.pathology.sourceCitation, p),
    row("Report date", p.pathology.reportDate, null, p.pathology.sourceCitation, p)
  ]));

  // Treatment
  const tx = p.treatmentTimeline.map((t) =>
    row("Line " + t.line, t.regimen + " (" + t.drugs.join(", ") + ") · from " + t.startDate +
      (t.endDate ? " to " + t.endDate : " · ongoing") + " · " + t.status, null, t.sourceCitation, p));
  card.appendChild(section("Treatment history", tx.length ? tx : [row("Treatment", "None recorded")]));

  // Late results
  if (p.lateResults && p.lateResults.length) {
    card.appendChild(section("Late results", p.lateResults.map((l) =>
      row(l.item, "Ordered " + l.orderedDate + ", arrived " + l.arrivedDate + " — " + l.summary, "fresh", l.sourceCitation, p))));
  }

  const note = el("div", "footnote", "Click any resource chip to trace the value back to its FHIR R4 record in the source bundle.");
  note.style.textAlign = "left"; note.style.padding = "0 18px 16px";
  card.appendChild(note);
  return card;
}

/* ---- readiness ---- */
function tabReady(c) {
  const p = c.packet, rs = c.readiness;
  const fails = failing(c);
  const card = el("div", "card");
  card.appendChild(el("div", "card-h",
    "<h3>Discussion readiness</h3><span class='sub'>" + rs.passed + " of " + rs.total +
    " required evidence items present</span><div class='spacer'></div>" +
    "<span class='sub'>packet says: " + esc(p.readinessState.status) + "</span>"));

  const b = el("div", "card-b");
  b.style.paddingBottom = "6px";
  b.innerHTML = "<div class='sub' style='font-size:12.5px'><b>Packet reason:</b> " + esc(p.readinessState.reason) + "</div>";
  card.appendChild(b);

  rs.checks.forEach((k) => {
    const d = k.ok ? null : declaredFor(k.name, p.missingData);
    const rowEl = el("div", "ck");
    let tag = "";
    if (!k.ok) tag = d ? "<span class='tag dec'>" + esc(d.status) + "</span>" : "<span class='tag der'>derived</span>";
    let detail = esc(k.detail);
    if (d) detail += "<br><b>Reason:</b> " + esc(d.reason) + "<br><b>Impact:</b> " + esc(d.impact);
    else if (!k.ok) detail += "<br><i>Not listed in packet.missingData — flagged by the readiness rules.</i>";
    rowEl.innerHTML =
      '<div class="ic ' + (k.ok ? "ok" : "no") + '">' + (k.ok ? "✓" : "✕") + "</div>" +
      '<div class="body"><div class="t">' + esc(k.name) + tag + '</div><div class="d">' + detail + "</div></div>";
    if (!k.ok) {
      const btn = el("button", "btn sm", d && d.status === "result-pending" ? "Chase result" : "Raise request");
      btn.addEventListener("click", () => {
        btn.textContent = "Requested ✓"; btn.disabled = true;
        toast("Request raised", k.name + " — the case updates automatically when the result lands.");
      });
      rowEl.appendChild(btn);
    }
    card.appendChild(rowEl);
  });

  if (!fails.length) {
    const f = el("div", "card-b");
    f.innerHTML = "<div class='sub'>All readiness rules pass. Packet status is <b>" + esc(p.readinessState.status) + "</b>.</div>";
    card.appendChild(f);
  }
  return card;
}

/* ---- timeline ---- */
function tabTimeline(c) {
  const p = c.packet;
  const evs = [];
  const push = (d, t, x, hi) => { if (d) evs.push({ d: d, t: t, x: x, hi: !!hi }); };

  push(p.diagnosis.primary.diagnosisDate, "Primary diagnosis",
    p.diagnosis.primary.display + " — " + p.diagnosis.primary.histology + ", " + p.diagnosis.primary.site);
  p.diagnosis.metastases.forEach((m) => push(m.diagnosisDate, "Metastasis recorded", cap(m.site) + " (" + m.system + " " + m.code + ")"));
  push(p.pathology.reportDate, "Pathology report", cap(p.pathology.histology) + " — " + p.pathology.site);

  const molDates = {};
  ["kras", "nras", "braf", "msi"].forEach((k) => {
    const m = p.molecularProfile[k]; if (!m) return;
    (molDates[m.date] = molDates[m.date] || []).push((k === "msi" ? "MSI/MMR" : k.toUpperCase()) + " " + (m.interpretation || m.status));
  });
  Object.keys(molDates).forEach((d) => push(d, "Molecular panel", molDates[d].join(" · ")));

  p.treatmentTimeline.forEach((t) => push(t.startDate, "Line " + t.line + " started", t.regimen + " (" + t.drugs.join(", ") + ") — " + t.status));
  p.treatmentTimeline.forEach((t) => push(t.endDate, "Line " + t.line + " ended", t.regimen));
  push(p.labs.cea.date, "CEA resulted", p.labs.cea.value + " " + p.labs.cea.unit + (p.labs.cea.isCurrent ? "" : " — now stale"));
  p.imaging.forEach((i) => push(i.date, i.type + (i.status === "result-pending" ? " ordered" : i.arrivedDate ? " performed" : " resulted"),
    i.summary + " · status " + i.status + (i.arrivedDate ? " · reported " + i.arrivedDate : ""), i.status === "result-pending"));
  (p.lateResults || []).forEach((l) => push(l.arrivedDate, "Late result reported — " + l.item, l.summary, true));
  push(p.ecog ? p.ecog.date : null, "Performance status", "ECOG " + (p.ecog ? p.ecog.score : "?"));
  push(MDO.meta.referenceDate, "MDO — reference date", p.decisionPoint.question, true);

  evs.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));

  const card = el("div", "card");
  card.appendChild(el("div", "card-h", "<h3>Longitudinal timeline</h3><span class='sub'>" + evs.length + " events derived from the packet</span>"));
  const b = el("div", "card-b");
  const tl = el("div", "tl");
  evs.forEach((e) => {
    const n = el("div", "ev" + (e.hi ? " hi" : ""));
    n.innerHTML = '<div class="d8">' + esc(e.d) + '</div><div class="tt">' + esc(e.t) + '</div><div class="dd">' + esc(e.x) + "</div>";
    tl.appendChild(n);
  });
  b.appendChild(tl); card.appendChild(b);
  return card;
}

/* ---- cohort / patients like this one ---- */
const CRITERIA = [
  { k: "mol", l: "Molecular profile",
    val: (a) => (a.ras && a.braf && a.msi) ? ("RAS " + a.ras + " · BRAF " + a.braf + " · " + a.msi) : null,
    test: (x, a) => x.ras === a.ras && x.braf === a.braf && x.msi === a.msi,
    na: "molecular profile is incomplete in the packet" },
  { k: "mCategory", l: "Metastatic burden",
    val: (a) => a.mCategory, test: (x, a) => x.mCategory === a.mCategory,
    na: "M category is absent" },
  { k: "side", l: "Primary side",
    val: (a) => a.side, test: (x, a) => x.side === a.side,
    na: "primary site could not be classified" },
  { k: "ecog", l: "Performance status",
    val: (a) => (a.ecog === null || a.ecog === undefined) ? null : ("ECOG " + a.ecog),
    test: (x, a) => x.ecog === a.ecog, na: "ECOG is not recorded" },
  { k: "ageBand", l: "Age band",
    val: (a) => a.ageBand, test: (x, a) => x.ageBand === a.ageBand, na: "age band is absent" },
  { k: "priorLines", l: "Prior lines",
    val: (a) => a.priorLines + " line(s)", test: (x, a) => x.priorLines === a.priorLines,
    na: "treatment history is absent" }
];

function bar(label, n, total, tone) {
  const pct = total ? Math.round((100 * n) / total) : 0;
  return '<div class="bar"><div class="bl">' + esc(label) + '</div>' +
    '<div class="bt"><div class="bf ' + (tone || "") + '" style="width:' + pct + '%"></div></div>' +
    '<div class="bn">' + n + " · " + pct + "%</div></div>";
}
function tally(rows, key) {
  const m = {};
  rows.forEach((r) => { m[r[key]] = (m[r[key]] || 0) + 1; });
  return Object.keys(m).map((k) => [k, m[k]]).sort((a, b) => b[1] - a[1]);
}

function tabCohort(c) {
  const a = c.attrs, p = c.packet;
  const card = el("div", "card");
  card.appendChild(el("div", "card-h",
    "<h3>Similar cases</h3><span class='sub'>governed historic cohort · " + MDO.cohort.length +
    " cases across " + MDO.meta.cohortHospitals.length + " hospitals</span>"));
  const b = el("div", "card-b");

  // criteria
  b.appendChild(el("span", "lbl", "Match on"));
  const crit = el("div", "crit");
  const unavailable = [];
  CRITERIA.forEach((cr) => {
    const v = cr.val(a);
    const on = state.criteria[cr.k];
    if (v === null || v === undefined) unavailable.push(cr);
    const btn = el("button", "c" + (v == null ? " na" : on ? " on" : ""));
    btn.innerHTML = '<span class="box">' + (v != null && on ? "✓" : "") + "</span>" + esc(cr.l) +
      (v != null ? ' <span class="val">' + esc(v) + "</span>" : ' <span class="val">unavailable</span>');
    if (v != null) btn.addEventListener("click", () => { state.criteria[cr.k] = !state.criteria[cr.k]; renderDetail(); });
    crit.appendChild(btn);
  });
  b.appendChild(crit);

  const active = CRITERIA.filter((cr) => state.criteria[cr.k] && cr.val(a) != null);
  const ignored = CRITERIA.filter((cr) => state.criteria[cr.k] && cr.val(a) == null);

  if (ignored.length) {
    const w = el("div", "note-bad");
    w.style.marginTop = "16px";
    w.innerHTML = "<b>Cohort matching is degraded.</b> " +
      ignored.map((cr) => esc(cr.l) + " cannot be used — " + esc(cr.na)).join("; ") +
      ". Those criteria are ignored, so the comparison below is broader than requested. " +
      "Resolving the outstanding evidence would narrow it.";
    b.appendChild(w);
  }

  const rows = MDO.cohort.filter((x) => active.every((cr) => cr.test(x, a)));

  const head = el("div");
  head.style.cssText = "margin-top:16px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap";
  head.innerHTML = '<div class="nbig">' + rows.length + "</div>" +
    '<div class="nsub">of ' + MDO.cohort.length + " historic cases match" +
    (active.length ? " on " + active.map((cr) => esc(cr.l.toLowerCase())).join(" + ") : " (no criteria selected)") + "</div>";
  b.appendChild(head);

  if (!rows.length) {
    const e = el("div", "note-warn");
    e.style.marginTop = "14px";
    e.innerHTML = "<b>No comparable cases.</b> This combination does not occur in the cohort. " +
      "Deselect a criterion — start with the narrowest one — to widen the comparison.";
    b.appendChild(e);
    card.appendChild(b);
    card.appendChild(cohortGuard());
    return card;
  }

  if (rows.length < 15) {
    const e = el("div", "note-warn");
    e.style.marginTop = "14px";
    e.innerHTML = "<b>Subgroup too small to interpret.</b> " + rows.length +
      " cases is not enough to read anything into the distributions below. Shown for completeness only — " +
      "widen the criteria before drawing any conclusion.";
    b.appendChild(e);
  }

  // decisions
  const dec = tally(rows, "decision");
  b.appendChild(el("div", "lbl", "What comparable boards decided")).style.marginTop = "18px";
  const d1 = el("div", "bars");
  d1.innerHTML = dec.map((x) => bar(x[0], x[1], rows.length)).join("");
  b.appendChild(d1);

  // outcomes
  const out = tally(rows, "outcome");
  const tone = { "Complete response": "g", "Partial response": "g", "Stable disease": "a",
                 "Progressive disease": "r", "Not evaluable": "" };
  b.appendChild(el("div", "lbl", "Recorded outcome")).style.marginTop = "20px";
  const d2 = el("div", "bars");
  d2.innerHTML = out.map((x) => bar(x[0], x[1], rows.length, tone[x[0]])).join("");
  b.appendChild(d2);

  const months = rows.map((r) => r.monthsToNextTreatment).sort((x, y) => x - y);
  const med = months[Math.floor(months.length / 2)];
  b.appendChild(el("div", "nsub", "Median time to next treatment in this subgroup: <b>" + med +
    " months</b> (range " + months[0] + "–" + months[months.length - 1] + ").")).style.marginTop = "10px";

  // between-hospital variation
  b.appendChild(el("div", "lbl", "Variation between hospitals")).style.marginTop = "22px";
  if (rows.length < 24) {
    b.appendChild(el("div", "nsub", "Too few matches to compare hospitals meaningfully. " +
      "Widen the criteria to at least 24 cases."));
  } else {
    const top = dec.slice(0, 3).map((x) => x[0]);
    const t = el("table", "vtab");
    t.innerHTML = "<thead><tr><th>Hospital</th><th>n</th>" +
      top.map((d) => "<th>" + esc(d) + "</th>").join("") + "</tr></thead><tbody>" +
      MDO.meta.cohortHospitals.map((h) => {
        const hr = rows.filter((r) => r.hospital === h);
        if (!hr.length) return "";
        return "<tr><td>" + esc(h) + "</td><td>" + hr.length + "</td>" +
          top.map((dd) => {
            const n = hr.filter((r) => r.decision === dd).length;
            return "<td>" + Math.round((100 * n) / hr.length) + "%</td>";
          }).join("") + "</tr>";
      }).join("") + "</tbody>";
    b.appendChild(t);
    b.appendChild(el("div", "nsub", "Comparable patients, different answers depending on where they were discussed. " +
      "Measuring that spread is only possible once cases are normalised across hospitals.")).style.marginTop = "10px";
  }

  card.appendChild(b);
  card.appendChild(cohortGuard());
  return card;
}

function cohortGuard() {
  const g = el("div", "card-b");
  g.style.paddingTop = "0";
  g.innerHTML = "<div class='guard' style='margin:0'><b>Illustrative layer — descriptive, not advisory.</b> " +
    "The historic cohort is synthetic and is not part of the 2026-08-27 dataset. It reports what comparable " +
    "boards recorded in the past. It does not recommend, rank or endorse any treatment, and past decisions " +
    "are not evidence of what is right for this patient.</div>";
  return g;
}

/* ---- patient-facing summary ---- */
const SITE_PLAIN = {
  "caecum": "the beginning of the large bowel (the caecum)",
  "cecum": "the beginning of the large bowel (the caecum)",
  "ascending colon": "the first section of the colon (the ascending colon)",
  "transverse colon": "the middle section of the colon (the transverse colon)",
  "descending colon": "the later section of the colon (the descending colon)",
  "sigmoid colon": "the last section of the colon (the sigmoid)",
  "rectosigmoid junction": "where the colon joins the rectum",
  "rectum": "the rectum, the final part of the bowel"
};
const MET_PLAIN = {
  "liver": "the liver",
  "lung": "the lungs",
  "peritoneum": "the lining of the abdomen (the peritoneum)",
  "bone": "the bones",
  "brain": "the brain"
};
const ECOG_PLAIN = {
  0: "you are fully active and able to do everything you did before",
  1: "you are up and about, but heavy physical work is harder than it was",
  2: "you are up and about for more than half the day, but you need to rest for part of it",
  3: "you need to rest for more than half the day"
};
function plainSite(s) { return SITE_PLAIN[(s || "").toLowerCase()] || ("the " + s); }
function plainMet(s) { return MET_PLAIN[(s || "").toLowerCase()] || ("the " + s); }

function tabPatient(c) {
  const p = c.packet, a = c.attrs;
  const fails = failing(c);
  const ready = p.readinessState.status === "ready-for-review";

  const card = el("div", "card");
  card.appendChild(el("div", "card-h",
    "<h3>Patient summary</h3><span class='sub'>plain-language draft — for your doctor or nurse to review before it is shared</span>"));
  const b = el("div", "card-b");
  const ps = el("div", "ps");

  let h = "";

  h += "<h4>What we know about your illness</h4>";
  h += "<p class='lede'>You have a type of bowel cancer called <b>" + esc(p.diagnosis.primary.histology) +
    "</b>. It started in " + esc(plainSite(p.diagnosis.primary.site)) + ", and it was first diagnosed in " +
    esc(monthYear(p.diagnosis.primary.diagnosisDate)) + ".</p>";
  if (p.diagnosis.metastases.length) {
    h += "<p>Scans have shown that it has also spread to " +
      esc(listJoin(p.diagnosis.metastases.map((m) => plainMet(m.site)))) +
      ". When cancer has spread beyond where it started, doctors call this <b>stage " +
      esc(p.stage.stageGroup) + "</b>. It means treatment is aimed at controlling the cancer and keeping " +
      "you as well as possible for as long as possible.</p>";
  }

  h += "<h4>Tests that have been done</h4><ul>";
  h += "<li>A sample of the tumour was examined under a microscope (a <b>biopsy</b>), reported in " +
    esc(monthYear(p.pathology.reportDate)) + ".</li>";
  const molDet = [], molNot = [];
  ["kras", "nras", "braf"].forEach((k) => {
    const m = p.molecularProfile[k];
    if (!m || m.status === "not-tested") return;
    (m.status === "detected" ? molDet : molNot).push(k.toUpperCase());
  });
  if (molDet.length || molNot.length) {
    const bits = [];
    if (molDet.length) bits.push(molDet.length === 1
      ? "a change was found in the <b>" + molDet[0] + "</b> gene"
      : "changes were found in the <b>" + listJoin(molDet) + "</b> genes");
    if (molNot.length) bits.push(molNot.length === 1
      ? "no change was found in the <b>" + molNot[0] + "</b> gene"
      : "no changes were found in the <b>" + listJoin(molNot) + "</b> genes");
    h += "<li>The tumour was tested for genetic changes: " + listJoin(bits) +
      ". These results help the team work out which treatments are likely to work for you, and which are not.</li>";
  }
  const msi = p.molecularProfile.msi;
  if (msi && msi.status === "detected") {
    h += "<li>Your tumour has a fault in its DNA repair system (doctors call this <b>MSI-high</b>). " +
      "This is important, because tumours with this fault can respond to a type of treatment that uses your own immune system.</li>";
  } else if (msi && msi.status === "not-detected") {
    h += "<li>Your tumour does <b>not</b> have a fault in its DNA repair system. This means immune-system " +
      "treatments are less likely to help, so the team will focus on other options.</li>";
  }
  h += "<li>A blood test called <b>CEA</b> was taken in " + esc(monthYear(p.labs.cea.date)) +
    ". CEA is a substance some bowel cancers release; the team tracks it over time to see how things are going.</li>";
  p.imaging.forEach((i) => {
    if (i.status === "result-pending") return;
    h += "<li>A <b>CT scan</b> was done in " + esc(monthYear(i.date)) +
      (i.arrivedDate ? ", and the report came back on " + esc(longDate(i.arrivedDate)) : "") + ".</li>";
  });
  if (p.ecog) {
    h += "<li>The team recorded how you are managing day to day: " + esc(ECOG_PLAIN[p.ecog.score] ||
      "your level of daily activity was recorded") + ".</li>";
  }
  h += "</ul>";

  if (p.treatmentTimeline.length) {
    h += "<h4>Treatment you have had so far</h4><ul>";
    p.treatmentTimeline.forEach((t) => {
      h += "<li>A course of chemotherapy called <b>" + esc(t.regimen) + "</b>, which started in " +
        esc(monthYear(t.startDate)) + (t.endDate ? " and finished in " + esc(monthYear(t.endDate)) :
        " and you are still on it") + ".</li>";
    });
    h += "</ul>";
  }

  if (fails.length) {
    h += "<h4>What we are still waiting for</h4>";
    h += "<p>Before the team can make a decision, a few things still need to be in place:</p><ul>";
    fails.forEach((f) => { h += "<li>" + esc(plainGap(f, p)) + "</li>"; });
    h += "</ul><p>This is normal, and it is the reason your case may be moved to the next meeting rather than " +
      "discussed with information missing. Your team would rather wait a few days than decide without the full picture.</p>";
  } else {
    h += "<h4>Everything the team needs is ready</h4>";
    h += "<p>All the test results the team needs are in place, so your case can be discussed as planned.</p>";
  }

  h += "<h4>What the team will talk about</h4>";
  h += "<p>" + esc(PLAIN_QUESTION[p.decisionPoint.type] || PLAIN_QUESTION["default"]) + "</p>";

  h += "<h4>What happens next</h4>";
  h += "<p>A group of specialists — a cancer doctor, a surgeon, a radiologist who reads the scans, and a " +
    "pathologist who examines the tissue — meet together and go through your case. This is called a " +
    "<b>multidisciplinary meeting</b>. No single doctor decides on their own.</p>";
  h += "<p>" + (fails.length
    ? "Once the missing results arrive, your case will be put on the agenda. Your doctor or nurse will " +
      "contact you after the meeting to explain what was decided and what it means for you."
    : "After the meeting, your doctor or nurse will contact you to explain what was decided and to talk " +
      "through what it means for you.") + "</p>";
  h += "<p>If anything here is unclear, or you would like it explained differently, please ask your nurse " +
    "specialist. There is no such thing as a question that is too small.</p>";

  ps.innerHTML = h;
  b.appendChild(ps);
  card.appendChild(b);

  const g = el("div", "card-b");
  g.style.paddingTop = "0";
  g.innerHTML = "<div class='guard' style='margin:0'><b>Draft — not yet approved for sharing.</b> " +
    "Generated from the MDO packet in plain language. A clinician must read and approve it before it goes " +
    "to a patient. It contains no treatment recommendation and no prognosis. " + esc(p.guardrails.syntheticNotice) + ".</div>";
  card.appendChild(g);
  return card;
}

const PLAIN_QUESTION = {
  "continuation-review": "The team will look at how your current treatment is working, and decide together whether to carry on with it or try something different.",
  "restaging": "The team will look at your most recent scan and test results to see how the cancer has responded to treatment so far, and decide what should happen next.",
  "pending-imaging": "Once your scan result is available, the team will look at it together and decide what the best next step is.",
  "default": "The team will review your results together and agree what should happen next."
};

function plainGap(f, p) {
  const n = f.name.toLowerCase();
  if (n.indexOf("msi") >= 0) return "A test on your tumour sample that has not been done yet. It shows whether your tumour has a DNA repair fault, which affects which treatments can be considered.";
  if (n.indexOf("cea") >= 0) return "An up-to-date CEA blood test. The last one was taken in " + monthYear(p.labs.cea.date) + ", which is now too long ago to rely on.";
  if (n.indexOf("imaging") >= 0) return "The report from your CT scan. The scan has been done, but the radiologist has not finished writing it up yet.";
  if (n.indexOf("ecog") >= 0) return "A note from your team about how you are managing day to day. This helps them judge how much treatment you are likely to cope with.";
  if (n.indexOf("pathology") >= 0) return "The laboratory report on your tumour sample.";
  if (n.indexOf("stage") >= 0) return "A record of how far the cancer has spread.";
  return f.name + " is still outstanding.";
}
function monthYear(d) {
  if (!d) return "an earlier date";
  const M = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const parts = String(d).slice(0, 10).split("-");
  return (M[parseInt(parts[1], 10) - 1] || "") + " " + parts[0];
}
function longDate(d) {
  const M = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const parts = String(d).slice(0, 10).split("-");
  return parseInt(parts[2], 10) + " " + (M[parseInt(parts[1], 10) - 1] || "") + " " + parts[0];
}
function listJoin(arr) {
  if (arr.length <= 1) return arr[0] || "";
  return arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];
}

/* ---- decision & letter ---- */
const OUTCOMES = ["Continue current line", "Change systemic therapy", "Additional diagnostics required", "Refer to surgery", "Screen for trial", "Defer to next MDO"];

function tabDecision(c) {

function buildLetter(c, d) {
  const p = c.packet, rs = c.readiness;
  const fails = failing(c);
  const mol = ["kras", "nras", "braf", "msi"].map((k) => {
    const m = p.molecularProfile[k];
    return (k === "msi" ? "MSI/MMR" : k.toUpperCase()) + " " + (m ? (m.interpretation || m.status) : "absent");
  }).join("; ");

  return [
    "MULTIDISCIPLINARY ONCOLOGY BOARD - COLORECTAL",
    p.sourceHospital + "  |  reference date " + MDO.meta.referenceDate,
    "",
    "CASE            " + p.patientId,
    "DEMOGRAPHICS    " + p.header.ageBand + ", " + p.header.sex + ", born " + p.header.yearOfBirth,
    "DIAGNOSIS       " + p.diagnosis.primary.display + " (" + p.diagnosis.primary.system + " " + p.diagnosis.primary.code + ")",
    "HISTOLOGY       " + p.pathology.histology + ", " + p.pathology.site + " (report " + p.pathology.reportDate + ")",
    "STAGE           " + p.stage.system + " " + p.stage.tnm.combined + ", stage group " + p.stage.stageGroup,
    "METASTASES      " + (p.diagnosis.metastases.map((m) => m.site).join(", ") || "none recorded"),
    "PERFORMANCE     " + (p.ecog ? "ECOG " + p.ecog.score + " (" + p.ecog.date + ")" : "not recorded"),
    "MOLECULAR       " + mol,
    "CEA             " + p.labs.cea.value + " " + p.labs.cea.unit + " (" + p.labs.cea.date + ")" + (p.labs.cea.isCurrent ? "" : " - STALE"),
    "IMAGING         " + p.imaging.map((i) => i.type + " " + i.date + " [" + i.status + "]").join("; "),
    "CURRENT THERAPY " + (p.treatmentTimeline.map((t) => "line " + t.line + " " + t.regimen + " from " + t.startDate + " (" + t.status + ")").join("; ") || "none"),
    "",
    "QUESTION PUT TO THE BOARD",
    p.decisionPoint.question,
    "",
    "EVIDENCE COMPLETENESS",
    rs.passed + " of " + rs.total + " required items present. Packet status: " + p.readinessState.status + ".",
    p.readinessState.reason + ".",
    fails.length
      ? "Outstanding: " + fails.map((f) => f.name).join("; ") + "."
      : "No outstanding evidence gaps at the time of discussion.",
    "",
    "DECISION",
    (d.outcome || "[outcome not yet selected]") + ".",
    "",
    "RATIONALE",
    d.rationale.trim() || "[rationale to be completed]",
    "",
    "ACTIONS",
    "1. Inform patient and treating physician within 2 working days.",
    "2. Record decision in the MDO registry and the electronic record.",
    fails.length ? "3. Complete outstanding diagnostics and return to the board." : "3. Schedule response evaluation per protocol.",
    "",
    "NOTE  " + p.guardrails.noTreatmentAdvice,
    "      " + p.guardrails.syntheticNotice,
    "",
    "Chair signature: ____________________     Scribe: nurse specialist"
  ].join("\n");
}

/* ============================== voice copilot ============================== */
let voiceRecognition = null;

function voiceGaps(c) {
  return failing(c).map((f) => {
    const d = declaredFor(f.name, c.packet.missingData);
    return d ? f.name + " (" + d.status + ")" : f.name + " (derived gap)";
  });
}

function voiceOpening(c) {
  const p = c.packet, gaps = voiceGaps(c);
  const decision = state.decisions[c.short];
  if (decision && decision.outcome) {
    return "Yes. The board recorded " + decision.outcome + " for " + c.short +
      ". The rationale remains available in the Decision and letter view.";
  }
  if (gaps.length) {
    return c.short + " has no recorded board outcome yet. The automated review found " +
      gaps.length + " blocking item" + (gaps.length === 1 ? "" : "s") + ": " +
      listJoin(gaps) + ". The case should remain open for human review.";
  }
  return c.short + " is ready for review: all " + c.readiness.total +
    " required evidence checks pass. There is no recorded human board outcome yet. " +
    "The board question is: " + p.decisionPoint.question;
}

function voiceMissing(c) {
  const gaps = failing(c);
  if (!gaps.length) {
    return "Nothing required by the readiness rules is missing for " + c.short +
      ". All " + c.readiness.total + " checks pass.";
  }
  return "The review for " + c.short + " is blocked by " + gaps.map((f) => {
    const d = declaredFor(f.name, c.packet.missingData);
    return f.name + ": " + (d ? d.reason : f.detail);
  }).join(". ") + ".";
}

function voiceRadiology(c) {
  const imgs = c.packet.imaging || [];
  if (!imgs.length) return "The packet contains no imaging contribution for " + c.short + ".";
  return "Radiology contribution for " + c.short + ": " + imgs.map((i) =>
    i.type + " from " + i.date + " is " + i.status + ". " + i.summary +
    (i.arrivedDate ? " The report arrived on " + i.arrivedDate + "." : "")
  ).join(" ");
}

function voiceExchange(c) {
  const gaps = failing(c);
  const imagingGap = gaps.find((f) => f.name.toLowerCase().indexOf("imaging") >= 0);
  if (imagingGap) {
    return {
      text: "Radiology says the imaging result is still pending. The chief of staff therefore keeps the combined review incomplete and leaves the clinical decision to the board.",
      parts: [
        { role: "Radiologist", text: "The current imaging report is not final, so I cannot complete the radiology assessment." },
        { role: "Chief of staff", text: "I will keep the review incomplete and show the missing imaging evidence to the clinician." }
      ]
    };
  }
  return {
    text: "Radiology reports that current imaging is available. The chief of staff confirms that this dependency no longer blocks review, while the final clinical decision remains with the board.",
    parts: [
      { role: "Radiologist", text: "Current final imaging is available in the packet and linked to its source record." },
      { role: "Chief of staff", text: "The imaging dependency is resolved. I will present the evidence, not make the treatment decision." }
    ]
  };
}

function routeVoiceQuery(query, c) {
  const q = query.toLowerCase();
  if (q.indexOf("arriv") >= 0 || q.indexOf("result land") >= 0 || q.indexOf("resolve") >= 0) {
    if (c.short !== "IT-003") {
      return { tab: "ready", text: "The late-result simulation is attached to IT-003. I kept the current case unchanged." };
    }
    if (!state.resolved) simulateLateResult();
    const updated = caseOf("IT-003");
    return { tab: "timeline", text: "The CT report has arrived. The packet was regenerated and all " +
      updated.readiness.total + " readiness checks now pass. The case is ready for human review." };
  }
  if (q.indexOf("radiolog") >= 0 && (q.indexOf("voice") >= 0 || q.indexOf("exchange") >= 0 || q.indexOf("disagree") >= 0)) {
    const exchange = voiceExchange(c);
    return { tab: "packet", text: exchange.text, parts: exchange.parts };
  }
  if (q.indexOf("radiolog") >= 0 || q.indexOf("imaging") >= 0 || q.indexOf("report") >= 0) {
    return { tab: "packet", text: voiceRadiology(c) };
  }
  if (q.indexOf("missing") >= 0 || q.indexOf("block") >= 0 || q.indexOf("outstanding") >= 0) {
    return { tab: "ready", text: voiceMissing(c) };
  }
  if (q.indexOf("patient") >= 0 && (q.indexOf("summary") >= 0 || q.indexOf("explain") >= 0)) {
    return { tab: "patient", text: "I opened the patient-facing summary. It uses plain language, includes no prognosis or treatment recommendation, and requires clinician review before sharing." };
  }
  if (q.indexOf("trial") >= 0 || q.indexOf("research") >= 0) {
    const eligible = c.trials.filter((t) => t.verdict === "eligible").length;
    const blocked = c.trials.filter((t) => t.verdict === "blocked").length;
    return { tab: "trials", text: "Illustrative screening found " + eligible + " eligible and " + blocked +
      " unevaluable studies for " + c.short + ". This is descriptive screening, not treatment advice." };
  }
  if (q.indexOf("discuss") >= 0 || q.indexOf("outcome") >= 0 || q.indexOf("review") >= 0 || q.indexOf("plan") >= 0) {
    return { tab: "brief", text: voiceOpening(c) };
  }
  return { tab: "brief", text: "I can summarise the review status, explain missing information, show the radiology contribution, open trial screening, or play the specialist voice exchange for " + c.short + "." };
}

function showVoiceEvidence(short, tab) {
  if (state.mdoOn) exitMdo();
  state.view = "detail";
  state.caseId = short;
  state.tab = tab;
  $("#viewList").classList.add("hide");
  $("#viewDetail").classList.remove("hide");
  renderDetail();
  window.setTimeout(() => {
    const card = $("#viewDetail .grid2 > div:first-child .card");
    if (card) {
      card.classList.add("voice-focus");
      card.scrollIntoView({ behavior: "smooth", block: "start" });
    }
  }, 40);
}

function pickVoice(index) {
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  const english = voices.filter((v) => /^en([-_]|$)/i.test(v.lang));
  const pool = english.length ? english : voices;
  return pool.length ? pool[index % pool.length] : null;
}

function speakVoice(text, parts, startedAt) {
  if (!state.voiceSpeak || !("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const lines = parts && parts.length ? parts : [{ role: "Chief of staff", text: text }];
  lines.forEach((part, i) => {
    const u = new SpeechSynthesisUtterance(part.role + ". " + part.text);
    u.lang = "en-GB";
    u.rate = i ? 0.98 : 1.02;
    u.pitch = i ? 0.9 : 1.08;
    const v = pickVoice(i);
    if (v) u.voice = v;
    if (i === 0) {
      u.onstart = () => {
        state.voiceSpeechLatency = Math.round(performance.now() - startedAt);
        renderVoicePanel();
      };
    }
    window.speechSynthesis.speak(u);
  });
}

function processVoiceQuery(query, source) {
  const clean = String(query || "").trim();
  if (!clean) return;
  const startedAt = performance.now();
  state.voiceAttempts += 1;
  if (source === "microphone") state.voiceRecognised += 1;
  const c = caseOf(state.voiceCase);
  const answer = routeVoiceQuery(clean, c);
  state.voiceLatency = Math.round(performance.now() - startedAt);
  state.voiceSpeechLatency = null;
  state.voiceTurns.push({ who: "Clinician", text: clean, kind: "user" });
  state.voiceTurns.push({ who: answer.parts ? "Specialist exchange" : "Chief of staff", text: answer.text, kind: "agent" });
  if (state.voiceTurns.length > 10) state.voiceTurns = state.voiceTurns.slice(-10);
  showVoiceEvidence(state.voiceCase, answer.tab);
  renderVoicePanel();
  speakVoice(answer.text, answer.parts, startedAt);
}

function stopVoiceRecognition() {
  if (voiceRecognition) {
    try { voiceRecognition.stop(); } catch (e) { /* recognition may already be stopped */ }
  }
  state.voiceListening = false;
}

function startVoiceRecognition() {
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Recognition) {
    toast("Microphone unavailable", "Use the prompt buttons or type the clinician question. Spoken replies still work where supported.");
    return;
  }
  stopVoiceRecognition();
  voiceRecognition = new Recognition();
  voiceRecognition.lang = "en-GB";
  voiceRecognition.interimResults = false;
  voiceRecognition.maxAlternatives = 1;
  voiceRecognition.onstart = () => { state.voiceListening = true; renderVoicePanel(); };
  voiceRecognition.onend = () => { state.voiceListening = false; renderVoicePanel(); };
  voiceRecognition.onerror = (e) => {
    state.voiceListening = false;
    renderVoicePanel();
    toast("Voice recognition stopped", e.error === "not-allowed" ? "Microphone permission was not granted. Typed prompts remain available." : "Recognition error: " + e.error + ".");
  };
  voiceRecognition.onresult = (e) => processVoiceQuery(e.results[0][0].transcript, "microphone");
  voiceRecognition.start();
}

function renderVoicePanel() {
  const p = $("#voicePanel");
  p.classList.toggle("on", state.voiceOn);
  if (!state.voiceOn) return;
  const supported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

    : '<div class="vc-empty">Try the opening question, then ask a follow-up. The selected case remains in context.</div>';
  const success = state.voiceAttempts ? Math.round(100 * state.voiceRecognised / state.voiceAttempts) + "%" : "—";
  p.innerHTML =

    '<div class="vc-body"><div class="vc-context"><b>Case context</b><select id="vcCase">' +

      '</select></div><div class="vc-prompts">' +
      '<button class="vc-prompt" data-q="Has this patient been discussed, and what was the outcome?">Opening question</button>' +
      '<button class="vc-prompt" data-q="What information was missing?">Missing information</button>' +

      '<button class="vc-prompt" data-q="Play the radiology and chief of staff voice exchange.">Specialist voices</button>' +
      '<button class="vc-prompt" data-q="Simulate the late result arriving.">Late result</button></div>' +
      '<div id="vcTurns">' + turns + '</div>' +
      '<div class="vc-metrics"><div class="vc-metric"><div class="n">' + state.voiceAttempts + '</div><div class="l">Attempts</div></div>' +
      '<div class="vc-metric"><div class="n">' + (state.voiceLatency == null ? "—" : state.voiceLatency + " ms") + '</div><div class="l">Screen response</div></div>' +
