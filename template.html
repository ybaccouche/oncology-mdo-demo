    '<div class="vc-input"><button class="btn vc-mic' + (state.voiceListening ? " listening" : "") + '" id="vcMic" title="Use microphone">' +
      (state.voiceListening ? "■" : "🎙") + '</button><input id="vcInput" aria-label="Clinician question" placeholder="Ask about outcome, missing data or radiology…">' +
      '<button class="btn primary" id="vcSend">Ask</button></div>';

  $("#vcClose").addEventListener("click", () => {
    stopVoiceRecognition();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    state.voiceOn = false;
    renderVoicePanel();
  });
  $("#vcSound").addEventListener("click", () => {
    state.voiceSpeak = !state.voiceSpeak;
    if (!state.voiceSpeak && "speechSynthesis" in window) window.speechSynthesis.cancel();
    renderVoicePanel();
  });
  $("#vcCase").addEventListener("change", (e) => {
    state.voiceCase = e.target.value;
    state.voiceTurns = [];
    showVoiceEvidence(state.voiceCase, "brief");
    renderVoicePanel();
  });
  p.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => processVoiceQuery(b.dataset.q, "prompt")));
  $("#vcMic").addEventListener("click", () => state.voiceListening ? stopVoiceRecognition() : startVoiceRecognition());
  const submit = () => {
    const input = $("#vcInput");
    processVoiceQuery(input.value, "typed");
  };
  $("#vcSend").addEventListener("click", submit);
  $("#vcInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const turnsEl = $("#vcTurns");
  if (turnsEl) turnsEl.scrollTop = turnsEl.scrollHeight;
}

function toggleVoiceCopilot() {
  state.voiceOn = !state.voiceOn;
  if (state.voiceOn) {
    state.voiceCase = state.caseId || state.voiceCase;
    showVoiceEvidence(state.voiceCase, "brief");
  } else {
    stopVoiceRecognition();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }
  renderVoicePanel();
}

/* ============================== MDO mode ============================== */
function mdoOrder() {
  return ORDER.slice().sort((a, b) => caseOf(a).readiness.score - caseOf(b).readiness.score);
}
function enterMdo() {
  state.mdoOn = true;
  state.mdoIndex = 0;
  state.mdoStart = Date.now();
  $("#mdoMode").classList.add("on");
  document.body.style.overflow = "hidden";
  renderMdo();
  if (!mdoTimer) mdoTimer = setInterval(tickMdo, 1000);
}
function exitMdo() {
  state.mdoOn = false;
  $("#mdoMode").classList.remove("on");
  document.body.style.overflow = "";
  if (mdoTimer) { clearInterval(mdoTimer); mdoTimer = null; }
  if (state.view === "list") renderList(); else renderDetail();
}
let mdoTimer = null;
function tickMdo() {
  const t = $("#mmClock");
  if (!t) return;
  const s = Math.floor((Date.now() - state.mdoStart) / 1000);
  t.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}
function mdoGo(delta) {
  const n = mdoOrder().length;
  state.mdoIndex = Math.min(n - 1, Math.max(0, state.mdoIndex + delta));
  renderMdo();
}

function renderMdo() {
  const order = mdoOrder();
  const short = order[state.mdoIndex];
  const c = caseOf(short), p = c.packet, rs = c.readiness;
  const fails = failing(c);
  const d = state.decisions[short] || (state.decisions[short] = { outcome: null, rationale: "", letter: null });
  const root = $("#mdoMode");
  root.textContent = "";

  // top bar
  const top = el("div", "mm-top");
  top.innerHTML = "<div class='ttl'>MDO mode · Colorectal board</div>" +
    "<div class='sub'>Case " + (state.mdoIndex + 1) + " of " + order.length + "</div>";
  const prog = el("div", "mm-prog");
  order.forEach((s, i) => {
    const dot = el("div", "d" + (i === state.mdoIndex ? " on" : (state.decisions[s] && state.decisions[s].outcome) ? " done" : ""));
    dot.title = s;
    prog.appendChild(dot);
  });
  top.appendChild(prog);
  top.appendChild(el("div", "spacer"));
  const clock = el("div", "sub", "Elapsed <span class='mono' id='mmClock'>00:00</span>");
  top.appendChild(clock);
  const keys = el("div", "sub", "<span class='kbd'>←</span> <span class='kbd'>→</span> navigate · <span class='kbd'>Esc</span> exit");
  top.appendChild(keys);
  const ex = el("button", "btn sm", "Exit");
  ex.addEventListener("click", exitMdo);
  top.appendChild(ex);
  root.appendChild(top);

  // body
  const body = el("div", "mm-body");
  const inner = el("div", "mm-inner");

  const h = el("div", "mm-h");
  h.innerHTML = "<div><h2>" + c.flag + " " + esc(c.short) + "</h2>" +
    "<div class='s'>" + esc(ageOf(p.header)) + " · born " + p.header.yearOfBirth + " · " + esc(p.sourceHospital) + "</div>" +
    "<div class='s'>" + esc(cap(p.diagnosis.primary.histology)) + ", " + esc(p.diagnosis.primary.site) +
    " · " + esc(p.stage.tnm.combined) + " · stage " + esc(p.stage.stageGroup) + "</div></div>" +
    "<div class='spacer'></div><div style='text-align:right'>" + statusPill(p.readinessState.status) +
    "<div class='s' style='margin-top:6px'>Evidence " + rs.passed + "/" + rs.total + "</div></div>";
  inner.appendChild(h);

  if (fails.length) {
    const w = el("div", "mm-block");
    w.innerHTML = "<b>⚠ Not ready for discussion</b> — " + fails.length + " item(s) outstanding: " +
      fails.map((f) => esc(f.name)).join(", ") + ". <span class='sub'>" + esc(p.readinessState.reason) + "</span>";
    inner.appendChild(w);
  }

  const cols = el("div", "mm-cols");

  // key facts
  const kf = el("div", "card");
  kf.appendChild(el("div", "card-h", "<h3>Key facts</h3>"));
  const kb = el("div", "card-b");
  const mol = ["kras", "nras", "braf", "msi"].map((k) => {
    const m = p.molecularProfile[k];
    const label = k === "msi" ? "MSI/MMR" : k.toUpperCase();
    if (!m) return label + " absent";
    return label + " " + (m.interpretation || m.status);
  }).join(" · ");
  const cea = p.labs.cea;
  const img = p.imaging.map((i) => i.type + " " + i.date + " — " + i.summary).join(" | ");
  const facts = [
    ["Metastases", p.diagnosis.metastases.map((m) => cap(m.site)).join(", ") || "none recorded", ""],
    ["Performance", p.ecog ? "ECOG " + p.ecog.score + " (" + p.ecog.date + ")" : "not recorded", p.ecog ? "" : "bad"],
    ["Molecular", mol, (p.molecularProfile.msi && p.molecularProfile.msi.status === "not-tested") ? "bad" : ""],
    ["CEA", cea.value + " " + cea.unit + " (" + cea.date + ")" + (cea.isCurrent ? "" : " — stale"), cea.isCurrent ? "" : "warn"],
    ["Imaging", img, p.imaging.some((i) => i.status === "result-pending") ? "warn" : ""],
    ["Current therapy", p.treatmentTimeline.map((t) => "L" + t.line + " " + t.regimen + " (" + t.status + ")").join("; ") || "none", ""]
  ];
  facts.forEach((f) => {
    kb.appendChild(el("div", "fact",
      '<div class="k">' + esc(f[0]) + '</div><div class="v ' + f[2] + '">' + esc(f[1]) + "</div>"));
  });
  kf.appendChild(kb);
  cols.appendChild(kf);

  // question + open points
  const q = el("div", "card");
  q.appendChild(el("div", "card-h", "<h3>Question to the board</h3>"));
  const qb = el("div", "card-b");
  qb.innerHTML = "<div class='qbox' style='margin-bottom:14px'><h4 style='font-size:15px'>" +
    esc(p.decisionPoint.question) + "</h4><p>" + esc(p.decisionPoint.type) + "</p></div>";
  if (fails.length) {
    qb.innerHTML += "<div class='lbl'>Open before a decision can be made</div><ul style='margin:0;padding-left:18px'>" +
      fails.map((f) => {
        const dd = declaredFor(f.name, p.missingData);
        return "<li style='font-size:13px;margin-bottom:5px'>" + esc(f.name) +
          (dd ? " — <i>" + esc(dd.impact) + "</i>" : "") + "</li>";
      }).join("") + "</ul>";
  } else {
    const elig = c.trials.filter((t) => t.verdict === "eligible");
    qb.innerHTML += "<div class='lbl'>For reference</div><div style='font-size:13px'>All required evidence present. " +
      (elig.length ? elig.length + " trial(s) screen as eligible: " + elig.map((t) => esc(t.id)).join(", ") + "."
                   : "No trials screen as eligible.") + "</div>";
  }
  q.appendChild(qb);
  cols.appendChild(q);

  inner.appendChild(cols);

  // compact cohort snapshot — useful mid-discussion, explicitly descriptive
  const active = CRITERIA.filter((cr) => state.criteria[cr.k] && cr.val(c.attrs) != null);
  const coh = MDO.cohort.filter((x) => active.every((cr) => cr.test(x, c.attrs)));
  if (active.length && coh.length >= 15) {
    const cc = el("div", "card");
    cc.style.marginTop = "20px";
    cc.appendChild(el("div", "card-h",
      "<h3>Similar cases</h3><span class='sub'>" + coh.length + " historic cases matched on " +
      active.map((cr) => esc(cr.l.toLowerCase())).join(" + ") + " — descriptive, not advisory</span>"));
    const cb = el("div", "card-b");
    const dec = tally(coh, "decision").slice(0, 4);
    cb.innerHTML = '<div class="bars">' + dec.map((x) => bar(x[0], x[1], coh.length)).join("") + "</div>";
    cc.appendChild(cb);
    inner.appendChild(cc);
  }

  body.appendChild(inner);
  root.appendChild(body);

  // dock
  const dock = el("div", "mm-dock");
  const din = el("div", "mm-dock-in");
  const prev = el("button", "btn sm", "← Previous");
  prev.disabled = state.mdoIndex === 0;
  prev.addEventListener("click", () => mdoGo(-1));
  din.appendChild(prev);

  const chips = el("div", "chipsrow");
  chips.style.margin = "0";
  OUTCOMES.forEach((o) => {
    const ch = el("button", "chip" + (d.outcome === o ? " on" : ""), esc(o));
    ch.addEventListener("click", () => { d.outcome = o; renderMdo(); });
    chips.appendChild(ch);
  });
  din.appendChild(chips);

  const ta = el("textarea");
  ta.placeholder = "Rationale…";
  ta.value = d.rationale;
  ta.addEventListener("input", () => { d.rationale = ta.value; });
  din.appendChild(ta);

  const next = el("button", "btn sm primary", state.mdoIndex === order.length - 1 ? "Save & finish" : "Save & next →");
  next.addEventListener("click", () => {
    if (state.mdoIndex === order.length - 1) {
      const done = order.filter((s) => state.decisions[s] && state.decisions[s].outcome).length;
      exitMdo();
      toast("Board complete", done + " of " + order.length + " cases have a recorded decision. Letters can be drafted from the Decision tab.");
    } else mdoGo(1);
  });
  din.appendChild(next);

  dock.appendChild(din);
  root.appendChild(dock);
  tickMdo();
}

document.addEventListener("keydown", (e) => {
  if (!state.mdoOn) return;
  if (e.key === "Escape") { exitMdo(); return; }
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  if (e.key === "ArrowRight") { e.preventDefault(); mdoGo(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); mdoGo(-1); }
});

/* ============================== init ============================== */
$("#simBtn").addEventListener("click", (e) => { e.stopPropagation(); simulateLateResult(); });
$("#mdoBtn").addEventListener("click", (e) => { e.stopPropagation(); enterMdo(); });
$("#voiceBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleVoiceCopilot(); });
$("#themeBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const cur = document.documentElement.getAttribute("data-theme");
  document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  if (state.view === "list") renderList(); else renderDetail();
});

renderShell();
renderList();
})();
</script>
</body>
